<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习资料 · 入口</title>
<style>
  :root{
    --bg:#f5f2ea; --card:#fffdf8; --ink:#2c3038; --sub:#6b7280;
    --line:#e4ddcd; --brand:#2b6ef2; --brand2:#1b7f3b; --brand3:#7a2a24;
    --shadow:0 6px 20px rgba(60,50,30,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:980px;margin:0 auto;padding:48px 20px 64px}
  header{text-align:center;margin-bottom:36px}
  header h1{font-size:30px;margin:0 0 8px;letter-spacing:.5px}
  header p{margin:0;color:var(--sub);font-size:14.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
  .card{
    display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:22px 22px 20px;box-shadow:var(--shadow);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(60,50,30,.13)}
  .tag{display:inline-block;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin-bottom:12px;align-self:flex-start;background:#faf8f2}
  .card h2{font-size:19px;margin:0 0 8px}
  .card p{margin:0 0 16px;color:var(--sub);font-size:14px;flex:1}
  .btn{
    display:inline-block;align-self:flex-start;text-decoration:none;color:#fff;
    padding:9px 18px;border-radius:22px;font-size:14px;font-weight:600;
  }
  .btn.b1{background:var(--brand)}
  .btn.b2{background:var(--brand2)}
  .btn.b3{background:var(--brand3)}
  .sub-links{margin:14px 0 0;padding-top:14px;border-top:1px dashed var(--line);font-size:13.5px}
  .sub-links a{color:var(--brand);text-decoration:none;margin-right:14px;white-space:nowrap}
  .sub-links a:hover{text-decoration:underline}
  footer{margin-top:40px;text-align:center;color:#9aa0a8;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>学习资料 · 入口</h1>
    <p>三个自学网站的汇总入口，点击卡片进入。</p>
  </header>

  <main class="grid">
    <section class="card">
      <span class="tag">生物学</span>
      <h2>细胞生物学 · 自学网页</h2>
      <p>细胞生物学自学讲义、图解与练习。</p>
      <a class="btn b1" href="https://newkan-li.github.io/cell-biology/">进入细胞生物学</a>
    </section>

    <section class="card">
      <span class="tag">英语</span>
      <h2>英语学习 · 阅读题路精讲 · 10 套合集</h2>
      <p>四级 10 套逐题精讲，另含考研英语一 7 套真题精讲与考研词汇学习页。</p>
      <a class="btn b2" href="https://newkan-li.github.io/cet-learn/">进入英语学习</a>
      <div class="sub-links">
        <a href="https://newkan-li.github.io/cet-learn/">英语学习 · 十套精讲</a>
        <a href="https://newkan-li.github.io/cet-learn/kaoyan-vocab.html">考研词汇</a>
        <a href="https://newkan-li.github.io/cet-learn/kaoyan-2025.html">考研英语一真题</a>
      </div>
    </section>

    <section class="card">
      <span class="tag">生物学</span>
      <h2>分子生物学 · 自学网页</h2>
      <p>分子生物学自学讲义、图解与练习。</p>
      <a class="btn b3" href="https://newkan-li.github.io/molecular/">进入分子生物学</a>
    </section>
  </main>

  <footer>newkan-li.github.io/study</footer>
</div>
</body>
</html>
